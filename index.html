<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camping Cosmopolite — La Roche-en-Ardenne</title>
<meta name="description" content="Camping Cosmopolite: kamperen aan de oevers van de Ourthe in La Roche-en-Ardenne. Tenten, caravans en campers welkom. Reserveer online.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏕️</text></svg>">
<link rel="stylesheet" href="/shared/website.css?v=20260719a">
<style>
  *{box-sizing:border-box;} body{margin:0; background:var(--cw-bg,#F6F7F5);}
  .cw-root{min-height:100vh; display:flex; flex-direction:column;}
  .site-top{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid #E6E8EC;}
  .site-top-in{max-width:960px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:11px 20px;}
  .site-logo{font-weight:800; font-size:17px; color:#1B8A5B; text-decoration:none; white-space:nowrap;}
  .site-nav{display:flex; gap:2px; margin-left:auto; flex-wrap:wrap;}
  .site-nav a{font-size:14px; color:#5B6470; text-decoration:none; padding:7px 11px; border-radius:9px; font-weight:600;}
  .site-nav a:hover{background:#EEF0F3;} .site-nav a.on{background:#E6F3EC; color:#1B8A5B;}
  .site-cta{background:#1B8A5B; color:#fff !important; padding:8px 15px !important;}
  .site-lang{display:flex; gap:0; border:1px solid #E6E8EC; border-radius:9px; overflow:hidden; flex-shrink:0;}
  .site-lang button{border:none; background:#fff; color:#5B6470; font-size:12px; font-weight:700; padding:7px 10px; cursor:pointer;}
  .site-lang button.on{background:#1B8A5B; color:#fff;}
  .site-burger{display:none; margin-left:auto; border:1px solid #E6E8EC; background:#fff; border-radius:9px; width:38px; height:38px; font-size:18px; cursor:pointer;}
  main{flex:1; width:100%;}
  .site-foot{background:#1C1C1E; color:rgba(255,255,255,.6); font-size:13px; padding:26px 20px; margin-top:40px;}
  .site-foot-in{max-width:960px; margin:0 auto; line-height:1.9;}
  .site-foot a{color:rgba(255,255,255,.85); text-decoration:underline;}
  .site-foot .n{color:#fff; font-weight:700; margin-bottom:6px; font-size:15px;}
  @media(max-width:720px){
    .site-burger{display:block;}
    .site-nav{display:none; margin-left:0; width:100%; flex-direction:column; padding:8px 20px 14px; background:#fff; border-top:1px solid #E6E8EC;}
    .site-nav.open{display:flex;}
    .site-top-in{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="cw-root">
  <div class="site-top">
    <div class="site-top-in">
      <a class="site-logo" href="#home">🏕️ Camping Cosmopolite</a>
      <button class="site-burger" id="burger" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
      <nav class="site-nav" id="nav"></nav>
      <div class="site-lang">
        <button id="lang-nl" onclick="setSiteLang('nl')">NL</button>
        <button id="lang-fr" onclick="setSiteLang('fr')">FR</button>
      </div>
    </div>
  </div>
  <main><div class="cw-wrap" id="site"><p style="padding:40px 0;text-align:center;color:#8A929C;">Laden…</p></div></main>
  <footer class="site-foot"><div class="site-foot-in" id="foot"></div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/shared/website-render.js?v=20260719a"></script>
<script>
const SUPABASE_URL='https://whubbowuqhjdkdequbmb.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodWJib3d1cWhqZGtkZXF1Ym1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMjM3NTYsImV4cCI6MjA5Nzc5OTc1Nn0.1S-eme0sMmC_25H-XnZ9r3AMKFSSxnpRx3-GRefSyzs';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let sitePaginas=[], siteCtx={prices:{},accTypes:[]}, siteLang=localStorage.getItem('cc_site_lang')||'nl';
const NAV_RES={nl:'Reserveren',fr:'Réserver'};

async function loadSiteData(){
  // Tarieven (voor het tarieven-blok) uit de gedeelde club_settings.
  try{
    const {data}=await sb.from('club_settings').select('key,value')
      .in('key',['prijs_tent','prijs_camper','prijs_volwassene','prijs_kind','prijs_baby','prijs_hond','prijs_extra_auto','prijs_elektriciteit','prijs_afval_per_6','toeristentaks','accommodatie_types']);
    const pm={};(data||[]).forEach(s=>pm[s.key]=s.value);
    const map={prijs_tent:'tent',prijs_camper:'camper',prijs_volwassene:'volwassene',prijs_kind:'kind',prijs_baby:'baby',prijs_hond:'hond',prijs_extra_auto:'extraAuto',prijs_elektriciteit:'elektriciteit',prijs_afval_per_6:'afvalPer6',toeristentaks:'toeristentaks'};
    const prices={};Object.keys(map).forEach(k=>{if(pm[k]!=null)prices[map[k]]=parseFloat(pm[k]);});
    let accTypes=[];try{accTypes=JSON.parse(pm.accommodatie_types||'[]')||[];}catch(e){}
    siteCtx={prices,accTypes};
  }catch(e){}
  const {data:pag}=await sb.from('website_paginas').select('*').eq('zichtbaar',true).order('volgorde');
  sitePaginas=pag||[];
  renderNav(); renderFoot(); routeer();
}
function titel(p){return (siteLang==='fr'?p.titel_fr:p.titel_nl)||p.titel_nl||p.slug;}
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=sitePaginas.map(p=>'<a href="#'+p.slug+'" data-slug="'+p.slug+'">'+esc(titel(p))+'</a>').join('')+
    '<a class="site-cta" href="/reserveren">'+esc(NAV_RES[siteLang])+'</a>';
  document.getElementById('lang-nl').classList.toggle('on',siteLang==='nl');
  document.getElementById('lang-fr').classList.toggle('on',siteLang==='fr');
  document.documentElement.lang=siteLang;
}
function renderFoot(){
  const C=(window.CampingWebsite&&CampingWebsite.CONTACT)||{};
  document.getElementById('foot').innerHTML=
    '<div class="n">🏕️ Camping Cosmopolite</div>'+
    '<div>'+esc(C.adres||'')+'</div>'+
    '<div>📞 <a href="tel:'+esc((C.tel||'').replace(/\s/g,''))+'">'+esc(C.tel||'')+'</a> · ✉️ <a href="mailto:'+esc(C.email||'')+'">'+esc(C.email||'')+'</a></div>'+
    '<div style="margin-top:10px;"><a href="/privacy/">'+(siteLang==='fr'?'Vie privée':'Privacybeleid')+'</a> · © '+new Date().getFullYear()+' Camping Cosmopolite</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function routeer(){
  const slug=(location.hash||'#home').slice(1);
  const p=sitePaginas.find(x=>x.slug===slug)||sitePaginas[0];
  const site=document.getElementById('site');
  if(!p){site.innerHTML='<p style="padding:40px 0;text-align:center;color:#8A929C;">Geen inhoud gevonden.</p>';return;}
  site.innerHTML=CampingWebsite.renderPagina(p.blokken,siteLang,siteCtx);
  document.title=titel(p)+' — Camping Cosmopolite';
  document.querySelectorAll('#nav a[data-slug]').forEach(a=>a.classList.toggle('on',a.getAttribute('data-slug')===p.slug));
  document.getElementById('nav').classList.remove('open');
  window.scrollTo(0,0);
}
function setSiteLang(l){siteLang=l;localStorage.setItem('cc_site_lang',l);renderNav();renderFoot();routeer();}
window.addEventListener('hashchange',routeer);
loadSiteData();
</script>
</body>
</html>
