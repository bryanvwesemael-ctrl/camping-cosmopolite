[build]
  # Hercontrole 2026-10-11: met publish = "." werd de VOLLEDIGE repo publiek
  # geserveerd — ook SECURITY_AUDIT/ (incl. nog-open zwakke punten),
  # legal/verwerkersovereenkomst.md, supabase/ (migraties + broncode edge
  # functions) en de interne AUDIT_*.md. Nu een allow-list: enkel wat hier
  # expliciet gekopieerd wordt, komt online. Nieuwe publieke pagina? Hier
  # toevoegen, anders geeft ze 404.
  command = "rm -rf _site && mkdir -p _site/handleiding && cp -r index.html reserveren.html privacy upload betaald check-in dashboard dashboard-nieuw shared _site/ && cp handleiding/handleiding-camping-cosmopolite.html handleiding/Handleiding-Camping-Cosmopolite.pdf _site/handleiding/"
  publish = "_site"

# Websitewerk (nieuwe publieke site op root index.html) ligt tijdelijk on
# hold — de code blijft gewoon staan, maar de homepage wijst terug naar het
# reserveringsformulier (zoals vóór "website fase C"). Verwijder deze regel
# om de website terug op / te zetten.
[[redirects]]
  from = "/"
  to = "/reserveren.html"
  status = 200

# De nieuwe publieke website staat op / (root index.html). Het
# reserveringsformulier verhuisde naar reserveren.html; beide URL-vormen
# (met en zonder trailing slash) wijzen ernaar. Assets in het formulier
# gebruiken absolute /shared/-paden, dus dit werkt ongeacht de slash.
[[redirects]]
  from = "/reserveren"
  to = "/reserveren.html"
  status = 200

[[redirects]]
  from = "/reserveren/"
  to = "/reserveren.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

# Nieuw dashboard (preview) — draait naast het huidige, deelt dezelfde backend.
[[redirects]]
  from = "/dashboard-nieuw"
  to = "/dashboard-nieuw/index.html"
  status = 200

# ── Beveiligingsheaders ──────────────────────────────────────────────────────
# Audit 2026-08-08, bevinding F-07: deze headers stonden enkel op /dashboard*.
# Het reserveringsformulier — precies de pagina die naam, e-mail, geboortedatum
# én een foto van een identiteitsbewijs verzamelt — kreeg alleen HSTS mee en kon
# dus in een iframe op een vreemde site geladen worden (clickjacking).
# Nu gelden de basisheaders op ALLE routes.
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    # camera=(self) is nodig: gasten fotograferen hun ID rechtstreeks in de browser.
    Cross-Origin-Opener-Policy = "same-origin"

# CSP op de publieke pagina's — sinds hercontrole 2026-10-11 AFDWINGEND.
# Ze bevat nog 'unsafe-inline' (reserveren.html gebruikt inline onclick/style;
# opschonen is P2 in het remediatieplan), maar beperkt wél waar scripts
# vandaan mogen komen, waar gegevens naartoe mogen (connect-src: enkel
# Supabase/Cloudflare/jsDelivr — geen exfiltratie naar vreemde servers),
# en blokkeert plugins, <base>-kaping en formulieren naar externe adressen.
# Getest op een Netlify-draft vóór livegang (formulier, pdf-upload, betaald,
# check-in, privacy).
[[headers]]
  for = "/"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/reserveren"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/reserveren/"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/reserveren.html"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/index.html"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/upload/*"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/check-in/*"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/betaald/*"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/privacy/*"
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Overige routes (o.a. het oude /dashboard/, dat ook api.qrserver.com en
# Google gebruikt) blijven op Report-Only: zichtbaarheid zonder breukrisico.
[[headers]]
  for = "/*"
    [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Het dashboard bevat geen externe CDN-scripts buiten jsdelivr en is een
# gesloten omgeving — daar kan de CSP wél afdwingend.
[[headers]]
  for = "/dashboard-nieuw/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # wss:// staat er expliciet bij omdat het dashboard Supabase Realtime
    # gebruikt (sb.channel → WebSocket). Of een browser een https-bron ook als
    # match voor wss beschouwt, verschilt per implementatie — niet op gokken.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://whubbowuqhjdkdequbmb.supabase.co; connect-src 'self' https://whubbowuqhjdkdequbmb.supabase.co wss://whubbowuqhjdkdequbmb.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
